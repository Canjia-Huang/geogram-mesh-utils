name: External Consumption Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-consumption:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ================================================================================================
      # Checkout geolio into a consumer project at consumer/third_party/geolio — the exact location a
      # parent repo would use after `git submodule add <geolio-url> third_party/geolio`.
      # `submodules: recursive` mirrors `git submodule update --init --recursive`, pulling geolio's
      # nested spdlog/CLI11 submodules that third_party/CMakeLists.txt references as include dirs.
      # ================================================================================================

      - name: Checkout geolio as a submodule
        uses: actions/checkout@v6
        with:
          path: consumer/third_party/geolio
          submodules: 'recursive'

      # ================================================================================================
      # Install Geogram. geolio locates it through the GEOGRAM_DIR environment variable.
      # ================================================================================================

      - name: Install Dependency Geogram (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install cmake build-essential libx11-dev libxcb1-dev libxau-dev libxdmcp-dev
          sudo apt-get install libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev
          sudo apt-get install libtbb-dev
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Linux64-gcc-dynamic-Release
          make -j

      - name: Install Dependency Geogram (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          .\configure.bat
          $geogramRoot = Get-Location
          echo "GEOGRAM_DIR=$geogramRoot" >> $env:GITHUB_ENV
          cmake --build build/Windows --config Release --parallel

      - name: Install Dependency Geogram (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --recurse-submodules https://github.com/BrunoLevy/geogram.git
          cd geogram
          echo "GEOGRAM_DIR=$(pwd)" >> $GITHUB_ENV
          ./configure.sh
          cd build/Darwin-clang-dynamic-Release
          make -j

      # ================================================================================================
      # Parent project that consumes geolio as a submodule:
      #     add_subdirectory(third_party/geolio)
      #     target_link_libraries(<app> PRIVATE Geolio::geolio)
      # ================================================================================================

      - name: Create consumer project
        shell: bash
        run: |
          cat > consumer/CMakeLists.txt << 'CMAKEEOF'
          cmake_minimum_required(VERSION 3.30)
          project(GeolioConsumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          # Centralize build outputs so runtime artifacts (exe + shared libs/DLLs)
          # are co-located and easy to find at runtime.
          set(CMAKE_RUNTIME_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/bin)
          set(CMAKE_LIBRARY_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/lib)
          set(CMAKE_ARCHIVE_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/lib)

          add_subdirectory(third_party/geolio)

          add_executable(test_consumer main.cpp)
          target_link_libraries(test_consumer PRIVATE Geolio::geolio)
          CMAKEEOF

          cat > consumer/main.cpp << 'CEOF'
          #include <geolio/local_operation_optimization/tri_local_operation_optimization.h>
          #include <geogram/mesh/mesh.h>

          int main() {
              GEO::Mesh mesh(2);
              {
                  geolio::TriLocalOperationOptimization optimizer(mesh);
                  optimizer.fix_boundary_elements();
              }
              return 0;
          }
          CEOF

      - name: Configure consumer
        run: cmake -B consumer/build -S consumer -DCMAKE_BUILD_TYPE=Release

      - name: Build consumer
        run: cmake --build consumer/build --config Release --parallel

      # ================================================================================================
      # Run the consumer to verify runtime linking of the geolio shared library and geogram
      # ================================================================================================

      - name: Run consumer (Linux)
        if: runner.os == 'Linux'
        run: |
          LD_LIBRARY_PATH="${{ github.workspace }}/consumer/build/lib:$GEOGRAM_DIR/build/Linux64-gcc-dynamic-Release/lib" \
            consumer/build/bin/test_consumer

      - name: Run consumer (macOS)
        if: runner.os == 'macOS'
        run: |
          DYLD_LIBRARY_PATH="${{ github.workspace }}/consumer/build/lib:$GEOGRAM_DIR/build/Darwin-clang-dynamic-Release/lib" \
            consumer/build/bin/test_consumer

      - name: Run consumer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Runtime outputs are centralized in consumer\build\bin\<config> (see
          # CMAKE_RUNTIME_OUTPUT_DIRECTORY in the consumer CMakeLists), so the exe
          # and Geolio.dll sit side by side; geogram.dll comes from its own build.
          $env:Path = "${{ github.workspace }}\consumer\build\bin\Release;${{ env.GEOGRAM_DIR }}\build\Windows\bin\Release;$env:Path"
          consumer\build\bin\Release\test_consumer.exe
